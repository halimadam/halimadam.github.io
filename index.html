  <!-- Bubble-letter effect for the name: inflates any bold text into glossy, outlined bubbles. -->
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <filter id="bubble" x="-6%" y="-12%" width="112%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feComponentTransfer in="b" result="blob"><feFuncA type="linear" slope="14" intercept="-5"/></feComponentTransfer>
      <feMorphology in="blob" operator="dilate" radius="5" result="grow"/>
      <feOffset in="grow" dx="0" dy="9" result="dropOff"/>
      <feFlood flood-color="#5a0b20" result="dark"/>
      <feComposite in="dark" in2="dropOff" operator="in" result="drop"/>
      <feFlood flood-color="#e8204a" result="red"/>
      <feComposite in="red" in2="grow" operator="in" result="outline"/>
      <feFlood flood-color="#eef6ff" result="white"/>
      <feComposite in="white" in2="blob" operator="in" result="fill"/>
      <feGaussianBlur in="blob" stdDeviation="4" result="soft"/>
      <feSpecularLighting in="soft" surfaceScale="7" specularConstant="1.2" specularExponent="24" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="235" elevation="52"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="blob" operator="in" result="gloss"/>
      <feMerge>
        <feMergeNode in="drop"/>
        <feMergeNode in="outline"/>
        <feMergeNode in="fill"/>
        <feMergeNode in="gloss"/>
      </feMerge>
    </filter>
    <filter id="bubble-md" x="-6%" y="-12%" width="112%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.6" result="b"/>
      <feComponentTransfer in="b" result="blob"><feFuncA type="linear" slope="14" intercept="-5"/></feComponentTransfer>
      <feMorphology in="blob" operator="dilate" radius="3.6" result="grow"/>
      <feOffset in="grow" dx="0" dy="6.5" result="dropOff"/>
      <feFlood flood-color="#5a0b20" result="dark"/>
      <feComposite in="dark" in2="dropOff" operator="in" result="drop"/>
      <feFlood flood-color="#e8204a" result="red"/>
      <feComposite in="red" in2="grow" operator="in" result="outline"/>
      <feFlood flood-color="#eef6ff" result="white"/>
      <feComposite in="white" in2="blob" operator="in" result="fill"/>
      <feGaussianBlur in="blob" stdDeviation="3" result="soft"/>
      <feSpecularLighting in="soft" surfaceScale="5" specularConstant="1.2" specularExponent="24" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="235" elevation="52"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="blob" operator="in" result="gloss"/>
      <feMerge>
        <feMergeNode in="drop"/>
        <feMergeNode in="outline"/>
        <feMergeNode in="fill"/>
        <feMergeNode in="gloss"/>
      </feMerge>
    </filter>
    <filter id="bubble-sm" x="-6%" y="-12%" width="112%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.9" result="b"/>
      <feComponentTransfer in="b" result="blob"><feFuncA type="linear" slope="14" intercept="-5"/></feComponentTransfer>
      <feMorphology in="blob" operator="dilate" radius="2.1" result="grow"/>
      <feOffset in="grow" dx="0" dy="3.4" result="dropOff"/>
      <feFlood flood-color="#5a0b20" result="dark"/>
      <feComposite in="dark" in2="dropOff" operator="in" result="drop"/>
      <feFlood flood-color="#e8204a" result="red"/>
      <feComposite in="red" in2="grow" operator="in" result="outline"/>
      <feFlood flood-color="#eef6ff" result="white"/>
      <feComposite in="white" in2="blob" operator="in" result="fill"/>
      <feGaussianBlur in="blob" stdDeviation="1.5" result="soft"/>
      <feSpecularLighting in="soft" surfaceScale="3" specularConstant="1.2" specularExponent="24" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="235" elevation="52"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="blob" operator="in" result="gloss"/>
      <feMerge>
        <feMergeNode in="drop"/>
        <feMergeNode in="outline"/>
        <feMergeNode in="fill"/>
        <feMergeNode in="gloss"/>
      </feMerge>
    </filter>
  </svg>
